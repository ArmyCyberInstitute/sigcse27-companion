server {
    listen 80;
    server_name _;


#///////////// Uncomment these lines if enabling TLS without
# outer wrapper

#    listen [::]:80;

#    listen 443      ssl http2;
#    listen [::]:443 ssl http2;

#    ssl_certificate /etc/letsencrypt/fullchain.pem;
#    ssl_certificate_key /etc/letsencrypt/privkey.pem;
#    ssl_protocols TLSv1.2 TLSv1.3;
#/////////////


    # 1. Docker's internal DNS resolver is REQUIRED for variables in proxy_pass
    resolver 127.0.0.11 valid=10s;

    # 2. Regex match: /student1, /student50, etc.
    # Captures: 
    #   $id   -> the number (e.g., "5")
    #   $rest -> the path after it (e.g., "/auth_token.js")
    location ~ ^/student(?<id>\d+)(?<rest>/.*)?$ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-student-$id";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:7681$rest;

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # 6. Fix 'Origin' header issues if ttyd complains
        proxy_set_header Origin "";
    }

    location ~ ^/static-web-student(?<id>\d+)(?<rest>/.*)?$ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-student-$id";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:8000$rest;

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/instructor(?<rest>/.*)$ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-instructor-1";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:7681$rest;

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # 6. Fix 'Origin' header issues if ttyd complains
        proxy_set_header Origin "";
    }

       location ~ ^/static-web-instructor(?<rest>/.*)$ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-instructor-1";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:8000$rest;

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # 6. Fix 'Origin' header issues if ttyd complains
        proxy_set_header Origin "";
    }

    location ~ ^/mempool(?<rest>/.*)$ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-mempool-1";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:8080$rest;

        # Rewrite absolute paths in the HTML response
        sub_filter 'href="/' 'href="/mempool/';
        sub_filter 'src="/' 'src="/mempool/';
        sub_filter 'action="/' 'action="/mempool/';
        sub_filter '"/api/' '"/mempool/api/';
        sub_filter "'/api/" "'/mempool/api/";

        # Apply the filter to all occurrences, not just the first one
        sub_filter_once off;

        proxy_set_header Accept-Encoding "";

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 6. Fix 'Origin' header issues if ttyd complains
        proxy_set_header Origin "";
    }


    location /btc-explorer/ {

        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-mempool-1";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 2. WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api(?<rest>/.*)$ {
        # 3. Construct the target container hostname
        # Format: project-service-index
        set $target_host "bitcoin-mempool-1";

        # 4. Proxy Pass
        # Note: We pass $rest to keep the path valid for ttyd assets
        proxy_pass http://$target_host:8080/api$rest;

        # 5. Websocket Support (Required for ttyd)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # 6. Fix 'Origin' header issues if ttyd complains
        proxy_set_header Origin "";
    }
}
