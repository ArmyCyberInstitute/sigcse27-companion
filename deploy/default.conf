map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    # Docker DNS permits app restarts without stale proxy addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location = /labs/cryptography { return 308 /labs/cryptography/; }
    location /labs/cryptography/ {
        set $backend crypto:8501;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location = /labs/bitcoin { return 308 /labs/bitcoin/; }
    location = /labs/bitcoin/ { return 302 /labs/bitcoin/student/; }
    location = /labs/bitcoin/admin { return 302 /labs/bitcoin/instructor/; }
    location = /bitcoin.html { return 308 /labs/bitcoin/; }
    location = /labs/bitcoin/node-1 { return 308 /labs/bitcoin/node-1/; }
    location = /labs/bitcoin/node-2 { return 308 /labs/bitcoin/node-2/; }
    location /labs/bitcoin/node-1/ {
        set $backend bitcoin:7681;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location /labs/bitcoin/node-2/ {
        set $backend bitcoin-peer:7681;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location = /api/bitcoin/exercises {
        set $backend bitcoin:8000;
        proxy_pass http://$backend/catalog.json;
        include /etc/nginx/proxy.conf;
    }
    # Wallet sharing publishes two named resources, never runtime state or answer files.
    location ~ ^/labs/bitcoin/(student|instructor)/share/(?!index\.html$|address\.txt$).+ {
        return 404;
    }
    location /labs/bitcoin/student/share/ {
        set $backend bitcoin-peer:8000;
        rewrite ^/labs/bitcoin/student/share/(.*)$ /$1 break;
        proxy_pass http://$backend;
        include /etc/nginx/proxy.conf;
    }
    location /labs/bitcoin/instructor/share/ {
        set $backend bitcoin:8000;
        rewrite ^/labs/bitcoin/instructor/share/(.*)$ /$1 break;
        proxy_pass http://$backend;
        include /etc/nginx/proxy.conf;
    }
    location = /labs/bitcoin/mempool { return 308 /labs/bitcoin/mempool/; }
    location /labs/bitcoin/mempool/ {
        set $backend bitcoin-tools:8080;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location = /labs/bitcoin/btc-explorer { return 308 /labs/bitcoin/btc-explorer/; }
    location /labs/bitcoin/btc-explorer/ {
        set $backend bitcoin-tools:8081;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location /labs/bitcoin/graph/ {
        set $backend bitcoin-graph:8082;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy.conf;
    }
    location = /labs/ethereum/docs/instructor/INSTRUCTOR_LAB_SCENARIOS.md { return 404; }
    location = /labs/ethereum { return 308 /labs/ethereum/; }
    location /labs/ethereum/ {
        set $backend ethereum:8080;
        rewrite ^/labs/ethereum/(.*)$ /$1 break;
        proxy_pass http://$backend;
        include /etc/nginx/proxy.conf;
        proxy_set_header X-Instructor 1;
    }
    location /api/ethereum/ {
        set $backend ethereum:8080;
        rewrite ^/api/ethereum/(.*)$ /lab-api/$1 break;
        proxy_pass http://$backend;
        include /etc/nginx/proxy.conf;
        proxy_set_header X-Instructor 1;
    }
    location = /quiz { return 308 /quiz/; }
    location /quiz/ {
        set $backend quiz:8000;
        rewrite ^/quiz/(.*)$ /$1 break;
        proxy_pass http://$backend;
        include /etc/nginx/proxy.conf;
        proxy_set_header X-Forwarded-Prefix /quiz;
        # The local demo always has one instructor context. No login service.
        proxy_set_header X-Test-Instructor shared-demo;
    }
    location /source/ { types {} default_type text/plain; try_files $uri =404; }
    # Older guide URLs open their rendered pages; raw Markdown remains in /source/.
    location ~ ^/(docs/[^/]+|README|THIRD_PARTY_LICENSES|tests/playbooks/[^/]+|quizes/[^/]+|licenses/sources/README)\.md$ {
        return 308 /$1.html$is_args$args;
    }
    location / { try_files $uri $uri/ =404; }
}
