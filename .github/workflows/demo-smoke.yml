name: Check complete demonstration stack
on: workflow_dispatch
permissions:
  contents: read
jobs:
  demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OFFLINE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build demonstrations and release compiler caches between groups
        run: python3 scripts/build_demo_images.py --prune-cache
      - run: docker compose up --no-build --pull never -d --wait --wait-timeout 900
      - run: npm --prefix tests ci
      - run: tests/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix tests test
      - run: npm --prefix tests run test:unit
      - name: Check Solidity contracts on an isolated Hardhat network
        run: npm --prefix tests run test:ethereum-contracts
      - run: npm --prefix tests run test:bitcoin-terminal
      - run: npm --prefix tests run test:functional
      - run: npm --prefix tests run test:ethereum-api
      - run: npm --prefix tests run test:ethereum-extended
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-evidence
          path: |
            /tmp/companion-functional-evidence
            /tmp/ethereum-extended-evidence
            /tmp/bitcoin-zellij-*.png
            /tmp/companion-offline-evidence
      - if: always()
        run: df -h / /mnt
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
